<!DOCTYPE html>
<html>
<head>
    <title>版本更新</title>
    <style>
        body {
            margin: 0;
            background: transparent;
        }
        .wrap{
            border-radius: 20px;
            padding: 20px;
            overflow: hidden;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            background: #fff;
        }
        .title {
            font-size: 18px;
            margin-bottom: 30px;
        }
        .desc {
            font-size: 14px;
            margin-bottom: 20px;
        }
        .progress-container {
            width: 100%;
            height: 20px;
            background-color: #eee;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 30px;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: #007bff;
            transition: width 0.2s;
        }
        .btns {
            text-align: right;
        }
        .btn {
            margin-left: 10px;
            padding: 6px 12px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="title" id="title">🔄 发现新版本：--</div>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="btns">
            <button class="btn" id="cancelBtn">取消</button>
            <button class="btn" id="installBtn">立即更新</button>
            <button class="btn" id="installHideBtn">后台更新</button>
        </div>
    </div>
    <script>
        const handleCancelUpdate=(e)=>{
            window.electronAPI.cancelUpdate();
            e.target.style.cursor="not-allowed"
        }
        const handleInstall=()=>{
            window.electronAPI.installNow()
            e.target.style.cursor="not-allowed"
        }
        const handleInstallHide=()=>{
            window.electronAPI.hideWindow()
            e.target.style.cursor="not-allowed"
        }
        document.getElementById('cancelBtn').addEventListener('click', function(event) {
            handleCancelUpdate(event)
        },{once:true});
        document.getElementById('installBtn').addEventListener('click', function(event) {
            handleInstall(event)
        },{once:true});
        document.getElementById('installHideBtn').addEventListener('click', function(event) {
            handleInstallHide(event)
        },{once:true});
        window.electronAPI.onNewVersion((version)=>{
            document.getElementById('title').innerHTML='🔄 发现新版本：v'+version
        })
        window.electronAPI.onDownloadProgress((percent)=>{
            document.getElementById('progressBar').style.width = `${percent}%`;
        })
    </script>
</body>
</html>
